name: Verificacion del workshop

# Corre las 5 capas de tests/verificar.sh en cada push y pull request.
# La capa de logica usa Iceberg real, asi que tambien prueba el Lab 4
# (ALTER TABLE, UPDATE, snapshots y time travel). No usa ninguna cuenta de AWS.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Java 21 (Spark 3.5 lo soporta). Con Java 17 la JVM del runner se cae
      # (SIGSEGV en SymbolTable::do_lookup) al compilar con el JIT las clases
      # que genera el codegen de Spark. Glue 5.0 usa Java 17, pero la logica
      # de los jobs que se prueba aqui no depende de la version de Java.
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "21"

      - name: Instalar herramientas de verificacion
        run: pip install cfn-lint shellcheck-py pyyaml pyspark==3.5.4

      - name: Cache de Iceberg (Maven)
        uses: actions/cache@v4
        with:
          path: ~/.ivy2
          key: iceberg-spark-runtime-3.5_2.12-1.7.1

      - name: Verificar sintaxis, plantilla, consistencia, flujos y logica
        env:
          # Los intrinsics de Base64 de la JVM tienen un bug en algunas CPU con
          # AVX-512: corrompen memoria y la JVM cae con SIGSEGV en puntos
          # distintos. Spark e Iceberg usan Base64 todo el tiempo.
          _JAVA_OPTIONS: "-XX:+UnlockDiagnosticVMOptions -XX:DisableIntrinsic=_base64_encodeBlock,_base64_decodeBlock"
        run: tests/verificar.sh --iceberg

      - name: Mostrar el reporte de la JVM si se cayo
        if: failure()
        run: |
          for f in hs_err_pid*.log; do
            [ -f "$f" ] || continue
            grep -nE "^# Problematic|^Current thread|^Stack:" -A2 "$f"
            sed -n '/^Native frames/,/^$/p;/^Java frames/,/^$/p' "$f" | head -80
            sed -n '/^Other Threads/,+5p;/^Dynamic libraries/,+60p' "$f" | grep -iE "so|jni|Other" | head -60
          done

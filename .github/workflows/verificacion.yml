name: Verificacion del workshop

# Corre las 5 capas de tests/verificar.sh en cada push y pull request.
# La capa de logica usa Iceberg real, asi que tambien prueba el Lab 4
# (ALTER TABLE, UPDATE, snapshots y time travel). No usa ninguna cuenta de AWS.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Amazon Corretto 17: el mismo Java que usa AWS Glue 5.0
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "17"

      - name: Instalar herramientas de verificacion
        run: pip install cfn-lint shellcheck-py pyyaml pyspark==3.5.4

      - name: Cache de Iceberg (Maven)
        uses: actions/cache@v4
        with:
          path: ~/.ivy2
          key: iceberg-spark-runtime-3.5_2.12-1.7.1

      - name: Verificar sintaxis, plantilla, consistencia, flujos y logica
        run: tests/verificar.sh --iceberg

      - name: Mostrar el reporte de la JVM si se cayo
        if: failure()
        run: |
          for f in hs_err_pid*.log; do
            [ -f "$f" ] || continue
            grep -nE "^# Problematic|^Current thread|^Stack:" -A2 "$f"
            sed -n '/^Native frames/,/^$/p;/^Java frames/,/^$/p' "$f" | head -80
            sed -n '/^Dynamic libraries/,/^$/p' "$f" | grep -F ".so" | grep -v "$JAVA_HOME" | head -40
            sed -n '/^VM Arguments/,/^$/p;/^CPU:/,+3p' "$f" | head -30
          done
